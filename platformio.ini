;
; PlatformIO target project for CAN2040-Lite.
; Mirrors the FastAccelStepper RP2350 environment (Arduino-Pico core).
;
;   pio run                 - build
;   pio run -t upload       - flash (1200-baud touch reboots to BOOTSEL)
;   pio device monitor      - USB serial output
;
; The Raspberry Pi PlatformIO builder runs pioasm on src/pico/*.pio and
; writes the generated .pio.h next to each source file (gitignored).

[platformio]
src_dir = .
default_envs = rpipico2

[env:rpipico2]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = arduino
build_flags = -I src -I src/pico -I extras/tests/common -DCAN2040_LITE_ENABLE_PIO_LOOPBACK=1
build_src_filter =
    +<src/can2040_lite_proto.c>
    +<src/can2040_lite.c>
    +<src/pico/>
    +<extras/tests/on_target/>
    +<extras/tests/common/can_frame_build.c>
build_src_flags = -Werror -Wall -Wextra
monitor_speed = 115200

; Bitrate sweep environments for the loopback/Saleae tests.
[env:rpipico2_125k]
extends = env:rpipico2
build_flags = ${env:rpipico2.build_flags} -DCAN2040_LITE_BITRATE=125000

[env:rpipico2_1m]
extends = env:rpipico2
build_flags = ${env:rpipico2.build_flags} -DCAN2040_LITE_BITRATE=1000000
