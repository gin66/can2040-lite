; SPDX-License-Identifier: GPL-3.0-only
;
; PlatformIO target project for CAN2040-Lite.
; Mirrors the FastAccelStepper RP2350 environment (Arduino-Pico core).
;
;   pio run                 - build
;   pio run -t upload       - flash (1200-baud touch reboots to BOOTSEL)
;   pio device monitor      - USB serial output
;
; The running PIO instruction images are built at runtime by
; src/pico/can_pio_program.c.  rx.pio is a legacy reference and is not used.

[platformio]
src_dir = .
default_envs = rpipico2

[env:rpipico2]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = arduino
; These environments build the on-target test harness, so they select the
; CAN2040_LITE_TEST-only symbols (the callback-mode pump).
build_flags = -I src -I src/pico -I extras/tests/common -DCAN2040_LITE_ENABLE_PIO_LOOPBACK=1 -DCAN_ACK_GENERATION_SUPPORT=0 -DCAN2040_LITE_TEST
build_src_filter =
    +<src/can2040_lite_proto.c>
    +<src/can2040_lite.c>
    +<src/can_ack.c>
    +<src/can_edge_sm.c>
    +<src/can_rx_sm.c>
    +<src/pico/>
    +<extras/tests/on_target/main.cpp>
    +<extras/tests/common/can_frame_build.c>
build_src_flags = -Werror -Wall -Wextra
monitor_speed = 115200

; Software-only RX parser cycle benchmark for the Fly-Micro4 (RP2040, 133 MHz).
; No PIO, no backend and no CAN controller: only the portable parser, the
; protocol helpers and the frame builder.  The board settings match
; ../suspended-spheres/rp2040 so the numbers describe the production image:
; Earle Philhower core, 133 MHz, -O2, and the core's SysTick cycle counter.
[env:fly_micro4_rx_bench]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
framework = arduino
board_build.core = earlephilhower
board_build.f_cpu = 133000000L
build_unflags = -Os
build_flags =
    -I src
    -I extras/tests/common
    -DPICO_RP2040
    -O2
    -DCAN_ACK_GENERATION_SUPPORT=0
build_src_filter =
    +<src/can2040_lite_proto.c>
    +<src/can_rx_sm.c>
    +<extras/tests/common/can_frame_build.c>
    +<extras/tests/on_target/rx_bench.cpp>
build_src_flags = -Werror -Wall -Wextra
monitor_speed = 115200

; Per-bit version of the same benchmark: unstuff standard 11-bit DLC-8 frames
; and time can_rx_advance() once per unstuffed wire bit, producing a cost for
; every bit position in a standard CAN frame.
[env:fly_micro4_rx_bit_bench]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
framework = arduino
board_build.core = earlephilhower
board_build.f_cpu = 133000000L
build_unflags = -Os
build_flags =
    -I src
    -I extras/tests/common
    -DPICO_RP2040
    -O2
    -DCAN_ACK_GENERATION_SUPPORT=0
build_src_filter =
    +<src/can2040_lite_proto.c>
    +<src/can_rx_sm.c>
    +<extras/tests/common/can_frame_build.c>
    +<extras/tests/on_target/rx_bit_bench.cpp>
build_src_flags = -Werror -Wall -Wextra
monitor_speed = 115200

; Bitrate sweep environments for the loopback/Saleae tests.
[env:rpipico]
; RP2040 Pico 1 (BOOTSEL drive RPI-RP2)
extends = env:rpipico2
board = rpipico

[env:rpipico2_125k]
extends = env:rpipico2
build_flags = ${env:rpipico2.build_flags} -DCAN2040_LITE_BITRATE=125000

[env:rpipico2_1m]
extends = env:rpipico2
build_flags = ${env:rpipico2.build_flags} -DCAN2040_LITE_BITRATE=1000000

; Opt-in RX edge-pair capture log: the receiver records every FIFO word with
; reconstructed edge times, readable through can_edge_pair_record_*().
[env:rpipico2_record]
extends = env:rpipico2
build_flags = ${env:rpipico2.build_flags} -DCAN_EDGE_PAIR_TIME_RECORDING=1
